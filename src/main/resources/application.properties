# =====================================================================
#  LogiTrack - Configuracion de la aplicacion
# =====================================================================

# ----- Servidor embebido (Tomcat) -----
server.port=8080

# ----- Base de datos MySQL -----
spring.datasource.url=jdbc:mysql://localhost:3306/logitrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# ----- Scripts SQL de inicializacion -----
# schema.sql crea la estructura (cuando se usa ddl-auto=none).
# data.sql inserta datos de prueba (usuarios, bodegas, productos).
spring.sql.init.mode=always

# ----- JWT -----
jwt.secret=LogiTrackSecretoSuperLargoYSeguroParaFirmarLosTokensJWT2024CambiarEnProduccion1234567890
jwt.expiration=86400000

# ----- Swagger / OpenAPI -----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
